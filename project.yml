name: PodSnip
options:
  bundleIdPrefix: com.podsnip
  deploymentTarget:
    iOS: "17.0"
targets:
  PodSnip:
    type: application
    platform: iOS
    sources:
      - path: PodSnip
        excludes:
          - Info.plist
    info:
      path: PodSnip/Info.plist
      properties:
        NSSpeechRecognitionUsageDescription: 將下載的 Podcast 音檔轉成逐字稿，方便搜尋與擷取重點。
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.podsnip.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
  PodSnipTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PodSnip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.podsnip.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
  PodSnipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: PodSnip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.podsnip.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
schemes:
  PodSnip:
    build:
      targets:
        PodSnip: all
    test:
      targets:
        - PodSnipTests
        - PodSnipUITests
